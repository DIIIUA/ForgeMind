name: Android CI & Release APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Unit Tests & Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Unit Tests & Assemble Debug APK
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon --stacktrace

      - name: Rename APK artifact
        run: |
          VERSION_NAME="${GITHUB_REF_NAME:-dev}"
          cp app/build/outputs/apk/debug/app-debug.apk "ForgeMind-${VERSION_NAME}.apk"

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ForgeMind-APK
          path: ForgeMind-*.apk
          if-no-files-found: error

      - name: Publish GitHub Release on version tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ForgeMind-*.apk
          generate_release_notes: true
